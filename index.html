<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Freedom">
<meta name="theme-color" content="#12243F">
<title>Freedom Plan</title>
<style>
:root{--navy:#12243F;--navy2:#1B365D;--teal:#1F6F6A;--bg:#F1EBE1;--card:#FFFcf7;--ink:#1A1A1A;--muted:#6B655C;--line:#E3DACB;--in:#FFF3BF;--blue:#0018c8;--on:#C6EFCE;--onink:#0B6B2B;--tight:#FFEB9C;--tightink:#8A4B00;--off:#FFC7CE;--offink:#9C0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1,h2,p{margin:0}
button,input,select{font:inherit}
.app{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:700}
.app h1{font-size:22px;margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 10px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--in);color:var(--blue);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:12px;font-weight:800;color:#fff;background:var(--teal);width:100%}
.btn.danger{background:#8B1E3F;width:auto;padding:8px 10px;font-size:13px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 8px;background:#fff}
.tiny{font-size:12px;color:var(--muted);line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.amt{font-weight:800;font-variant-numeric:tabular-nums}
.pill{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.on{background:var(--on);color:var(--onink)}
.tight{background:var(--tight);color:var(--tightink)}
.off{background:var(--off);color:var(--offink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:0;border:0;color:#9bb0c9;font-size:11px;font-weight:700;padding:10px 2px}
.nav button.on{color:#fff}
.meter{height:18px;border-radius:99px;background:#e8e0d2;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px}
.track{display:flex;gap:4px;margin:8px 0 4px}
.track span{flex:1;height:8px;border-radius:99px;background:#ddd}
.track span.done{background:#1F6F6A}
.track span.now{background:#C4A35A}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.warn{background:#FDEBD0;border-radius:12px;padding:10px;font-size:13px;margin:0 0 10px}
.bad{background:var(--off);border-radius:12px;padding:10px;font-size:13px;margin:0 0 10px}
.ok{background:var(--on);border-radius:12px;padding:10px;font-size:13px;margin:0 0 10px}
.barline{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:6px}
.barline>i{display:block;height:100%;background:#2E75B6}
</style>
</head>
<body>
<header class="app">
  <div class="kicker">Glendale · Costco / Walmart estimates</div>
  <h1 id="title">This month</h1>
</header>
<div class="wrap" id="app"></div>
<nav class="nav">
  <button data-t="home" class="on">Home</button>
  <button data-t="cards">Cards</button>
  <button data-t="room">Room to spend</button>
  <button data-t="path">Freedom</button>
</nav>
<script src="app.js"></script>
</body>
</html>
